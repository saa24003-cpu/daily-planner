<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1日スケジュール＆生活習慣管理</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Favicon SVG Data URI to prevent 404 favicon errors -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .animate-ring {
            animation: pulse-ring 1s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-md shadow-indigo-200">
                    <i data-lucide="calendar-check-2" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900 leading-tight">DayPlanner Pro</h1>
                    <p class="text-xs text-slate-500 hidden sm:block">1日のスケジュール＆習慣管理</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-3">
                <div class="bg-slate-100 px-3 py-1.5 rounded-lg flex items-center space-x-2 text-sm font-medium text-slate-700">
                    <i data-lucide="clock" class="w-4 h-4 text-indigo-600"></i>
                    <span id="current-time-display">00:00:00</span>
                </div>
                <button id="toggle-sound-btn" class="p-2 text-slate-500 hover:text-indigo-600 hover:bg-slate-100 rounded-lg transition-colors flex items-center gap-1 text-xs font-semibold" title="アラーム試聴">
                    <i data-lucide="bell-ring" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">音のテスト</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Left Column: Calendar & Habit Tracker (4 cols) -->
        <section class="lg:col-span-4 flex flex-col space-y-6">
            
            <!-- Calendar Card -->
            <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm">
                <div class="flex items-center justify-between mb-4">
                    <h2 id="calendar-month-year" class="font-bold text-slate-800 text-base">2026年 9月</h2>
                    <div class="flex space-x-1">
                        <button id="prev-month-btn" class="p-1.5 hover:bg-slate-100 rounded-lg text-slate-600 transition-colors">
                            <i data-lucide="chevron-left" class="w-5 h-5"></i>
                        </button>
                        <button id="today-btn" class="px-2.5 py-1 text-xs font-semibold bg-indigo-50 text-indigo-600 hover:bg-indigo-100 rounded-lg transition-colors">
                            今日
                        </button>
                        <button id="next-month-btn" class="p-1.5 hover:bg-slate-100 rounded-lg text-slate-600 transition-colors">
                            <i data-lucide="chevron-right" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <!-- Days Header -->
                <div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-slate-400 mb-2">
                    <span class="text-rose-500">日</span>
                    <span>月</span>
                    <span>火</span>
                    <span>水</span>
                    <span>木</span>
                    <span>金</span>
                    <span class="text-sky-500">土</span>
                </div>

                <!-- Calendar Days Grid -->
                <div id="calendar-days-grid" class="grid grid-cols-7 gap-1 text-sm"></div>
            </div>

            <!-- Habit Tracker Widget -->
            <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm flex-1 flex flex-col">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                        <i data-lucide="sparkles" class="w-4 h-4 text-amber-500"></i> 今日の習慣・ルーティン
                    </h3>
                    <span id="habit-completion-rate" class="text-xs font-bold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-600">0% 完了</span>
                </div>
                <p class="text-xs text-slate-500 mb-4">歯磨き・ご飯・片付けなどの日常チェック</p>
                
                <div id="habits-list" class="space-y-2.5 overflow-y-auto max-h-60 pr-1 flex-1"></div>
            </div>
        </section>

        <!-- Right Column: Schedule & Task List (8 cols) -->
        <section class="lg:col-span-8 flex flex-col space-y-6">

            <!-- Banner -->
            <div class="bg-gradient-to-r from-indigo-600 to-indigo-700 rounded-2xl p-6 text-white shadow-md flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                    <div class="flex items-center space-x-2 opacity-90 text-sm mb-1">
                        <i data-lucide="calendar" class="w-4 h-4"></i>
                        <span id="selected-date-str">2026年9月26日 (土)</span>
                    </div>
                    <h2 class="text-2xl font-extrabold" id="selected-date-heading">本日の予定・タスク</h2>
                    <p class="text-xs opacity-80 mt-1" id="selected-date-sub">予定: <span id="event-count">0</span> 件 | 宿題: <span id="homework-count">0</span> 件</p>
                </div>
                <button id="open-add-modal-btn" class="bg-white text-indigo-700 hover:bg-indigo-50 font-bold px-4 py-2.5 rounded-xl text-sm shadow-sm transition-all duration-150 flex items-center space-x-2 shrink-0">
                    <i data-lucide="plus-circle" class="w-5 h-5"></i>
                    <span>予定・宿題を追加</span>
                </button>
            </div>

            <!-- View Switch Tabs -->
            <div class="flex border-b border-slate-200 space-x-6">
                <button id="tab-list-btn" class="pb-3 text-sm font-bold text-indigo-600 border-b-2 border-indigo-600 flex items-center space-x-2">
                    <i data-lucide="list-todo" class="w-4 h-4"></i>
                    <span>予定 & タスク一覧</span>
                </button>
                <button id="tab-timeline-btn" class="pb-3 text-sm font-bold text-slate-400 border-b-2 border-transparent hover:text-slate-600 flex items-center space-x-2">
                    <i data-lucide="clock" class="w-4 h-4"></i>
                    <span>24時間 タイムライン</span>
                </button>
            </div>

            <!-- Tab 1: List View -->
            <div id="view-list" class="space-y-4">
                <div class="flex gap-2 overflow-x-auto pb-1">
                    <button data-filter="all" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-white shadow-sm">すべて</button>
                    <button data-filter="routine" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50">ルーティン</button>
                    <button data-filter="homework" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50">宿題・作業</button>
                    <button data-filter="event" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50">イベント/予定</button>
                </div>

                <div id="events-container" class="space-y-3 min-h-[300px]"></div>
            </div>

            <!-- Tab 2: Timeline View -->
            <div id="view-timeline" class="hidden bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm">
                <div class="text-xs font-medium text-slate-500 mb-4 flex items-center justify-between">
                    <span><i data-lucide="info" class="w-3.5 h-3.5 inline mr-1"></i> 24時間のスケジュール配置</span>
                    <span class="text-indigo-600">※時間が重なる予定も一覧できます</span>
                </div>
                <div class="relative overflow-y-auto max-h-[500px] pr-2" id="timeline-container"></div>
            </div>

        </section>

    </main>

    <!-- Modal: Add/Edit Event -->
    <div id="item-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                <h3 id="modal-title" class="font-bold text-slate-800 text-base flex items-center gap-2">
                    <i data-lucide="calendar-plus" class="w-5 h-5 text-indigo-600"></i> 予定・タスクの追加
                </h3>
                <button id="close-modal-btn" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="item-form" class="p-6 space-y-4 overflow-y-auto flex-1">
                <input type="hidden" id="item-id">
                
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">カテゴリー</label>
                    <div class="grid grid-cols-3 gap-2">
                        <label class="cursor-pointer">
                            <input type="radio" name="category" value="routine" class="peer sr-only" checked>
                            <div class="p-2.5 rounded-xl border border-slate-200 text-center peer-checked:border-indigo-600 peer-checked:bg-indigo-50 peer-checked:text-indigo-600 transition-all">
                                <i data-lucide="sun" class="w-4 h-4 mx-auto mb-1"></i>
                                <span class="text-xs font-semibold block">ルーティン</span>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="category" value="homework" class="peer sr-only">
                            <div class="p-2.5 rounded-xl border border-slate-200 text-center peer-checked:border-amber-600 peer-checked:bg-amber-50 peer-checked:text-amber-600 transition-all">
                                <i data-lucide="book-open" class="w-4 h-4 mx-auto mb-1"></i>
                                <span class="text-xs font-semibold block">宿題・学習</span>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="category" value="event" class="peer sr-only">
                            <div class="p-2.5 rounded-xl border border-slate-200 text-center peer-checked:border-emerald-600 peer-checked:bg-emerald-50 peer-checked:text-emerald-600 transition-all">
                                <i data-lucide="calendar" class="w-4 h-4 mx-auto mb-1"></i>
                                <span class="text-xs font-semibold block">一般予定</span>
                            </div>
                        </label>
                    </div>
                </div>

                <div>
                    <label for="item-title" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">タイトル <span class="text-rose-500">*</span></label>
                    <input type="text" id="item-title" required placeholder="例: 漢字ドリル, 朝の歯磨き, 夜ご飯" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label for="item-start-time" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">開始時間 <span class="text-rose-500">*</span></label>
                        <input type="time" id="item-start-time" required class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label for="item-end-time" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">終了時間</label>
                        <input type="time" id="item-end-time" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <div id="homework-fields" class="hidden p-3.5 bg-amber-50/60 rounded-xl border border-amber-100 space-y-3">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label for="item-pages" class="block text-xs font-bold text-amber-800 mb-1">ページ数 / 範囲</label>
                            <input type="text" id="item-pages" placeholder="例: P.12〜15" class="w-full px-3 py-1.5 rounded-lg border border-amber-200 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 bg-white">
                        </div>
                        <div>
                            <label for="item-estimated-time" class="block text-xs font-bold text-amber-800 mb-1">目標作業時間 (分)</label>
                            <input type="number" id="item-estimated-time" placeholder="30" min="1" class="w-full px-3 py-1.5 rounded-lg border border-amber-200 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 bg-white">
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-100">
                    <div class="flex items-center space-x-2">
                        <i data-lucide="bell" class="w-4 h-4 text-amber-500"></i>
                        <div>
                            <p class="text-xs font-bold text-slate-700">連続鳴動アラームを有効化</p>
                            <p class="text-[10px] text-slate-400">開始時間になると止めるまで鳴り続けます</p>
                        </div>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="item-alarm" class="sr-only peer">
                        <div class="w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600"></div>
                    </label>
                </div>

                <div>
                    <label for="item-memo" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">メモ</label>
                    <textarea id="item-memo" rows="2" placeholder="持ち物や注意事項など" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>

                <div class="pt-3 flex justify-end space-x-2 border-t border-slate-100">
                    <button type="button" id="cancel-modal-btn" class="px-4 py-2 text-xs font-bold text-slate-600 hover:bg-slate-100 rounded-xl transition-colors">キャンセル</button>
                    <button type="submit" class="px-5 py-2 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-md shadow-indigo-100 transition-all">保存する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Alarm Ringing Overlay Modal (Continuous Loop) -->
    <div id="alarm-trigger-modal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-md z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl border-4 border-amber-400 space-y-4 animate-ring">
            <div class="w-20 h-20 bg-amber-100 rounded-full flex items-center justify-center mx-auto text-amber-500 animate-bounce">
                <i data-lucide="bell-ring" class="w-10 h-10"></i>
            </div>
            <div>
                <span class="text-xs font-bold text-rose-600 bg-rose-50 px-3 py-1 rounded-full uppercase tracking-wider border border-rose-200">⏰ アラーム発動中</span>
                <h3 id="alarm-modal-title" class="text-xl font-extrabold text-slate-900 mt-3">時間になりました！</h3>
                <p id="alarm-modal-time" class="text-base font-bold text-indigo-600 mt-1">10:00</p>
                <p id="alarm-modal-memo" class="text-xs text-slate-600 mt-2 bg-slate-50 p-2.5 rounded-xl border border-slate-200">宿題の時間です。集中して取り組もう！</p>
            </div>
            <button id="dismiss-alarm-btn" class="w-full py-3.5 bg-rose-500 hover:bg-rose-600 text-white font-extrabold rounded-xl shadow-lg shadow-rose-200 transition-all text-sm flex items-center justify-center gap-2">
                <i data-lucide="volume-x" class="w-5 h-5"></i>
                <span>アラームを止める</span>
            </button>
        </div>
    </div>

    <script>
        // State Management
        let currentDate = new Date();
        let selectedDate = new Date();
        let events = {}; 
        let currentFilter = 'all';
        let triggeredAlarms = new Set(); 
        
        // Audio Loop State
        let alarmIntervalId = null;
        let audioCtx = null;

        // DOM Elements
        const calendarGrid = document.getElementById('calendar-days-grid');
        const monthYearLabel = document.getElementById('calendar-month-year');
        const selectedDateHeading = document.getElementById('selected-date-heading');
        const selectedDateStr = document.getElementById('selected-date-str');
        const selectedDateSub = document.getElementById('selected-date-sub');
        const eventCountEl = document.getElementById('event-count');
        const homeworkCountEl = document.getElementById('homework-count');
        const eventsContainer = document.getElementById('events-container');
        const habitsListContainer = document.getElementById('habits-list');
        const habitCompletionRateEl = document.getElementById('habit-completion-rate');

        const itemModal = document.getElementById('item-modal');
        const itemForm = document.getElementById('item-form');
        const homeworkFields = document.getElementById('homework-fields');

        window.onload = function() {
            loadFromLocalStorage();
            renderCalendar();
            renderSelectedDate();
            setupEventListeners();
            startClockAndAlarmChecker();
            lucide.createIcons();
        };

        function formatDateKey(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function formatDisplayDate(date) {
            const days = ['日', '月', '火', '水', '木', '金', '土'];
            return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日 (${days[date.getDay()]})`;
        }

        function saveToLocalStorage() {
            localStorage.setItem('dayplanner_events', JSON.stringify(events));
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('dayplanner_events');
            if (saved) {
                try {
                    events = JSON.parse(saved);
                } catch(e) {
                    events = {};
                }
            } else {
                // Initial Default Data
                const todayKey = formatDateKey(new Date());
                events[todayKey] = [
                    { id: '1', category: 'routine', title: '朝の歯磨き＆洗顔', startTime: '07:00', endTime: '07:15', alarm: true, completed: false },
                    { id: '2', category: 'homework', title: '算数ドリル', startTime: '16:00', endTime: '17:00', pages: 'P.10-P.12', estimatedTime: '45', alarm: true, completed: false },
                    { id: '3', category: 'routine', title: '夜ご飯', startTime: '19:00', endTime: '19:30', alarm: false, completed: false }
                ];
                saveToLocalStorage();
            }
        }

        function renderCalendar() {
            calendarGrid.innerHTML = '';
            
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            monthYearLabel.textContent = `${year}年 ${month + 1}月`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();
            const prevLastDay = new Date(year, month, 0).getDate();

            const todayStr = formatDateKey(new Date());
            const selectedStr = formatDateKey(selectedDate);

            // Previous Month's overflow days
            for (let x = firstDayIndex; x > 0; x--) {
                const dayNum = prevLastDay - x + 1;
                const div = document.createElement('div');
                div.className = "h-9 flex items-center justify-center text-xs text-slate-300 rounded-lg cursor-not-allowed";
                div.textContent = dayNum;
                calendarGrid.appendChild(div);
            }

            // Days of current month
            for (let i = 1; i <= lastDay; i++) {
                const thisDate = new Date(year, month, i);
                const dateKey = formatDateKey(thisDate);
                const dayEvents = events[dateKey] || [];

                const button = document.createElement('button');
                button.className = `h-9 text-xs font-medium rounded-lg flex flex-col items-center justify-center relative transition-all`;
                
                if (dateKey === selectedStr) {
                    button.classList.add('bg-indigo-600', 'text-white', 'font-bold', 'shadow-md', 'shadow-indigo-200');
                } else if (dateKey === todayStr) {
                    button.classList.add('bg-indigo-50', 'text-indigo-600', 'font-bold', 'border', 'border-indigo-200');
                } else {
                    button.classList.add('hover:bg-slate-100', 'text-slate-700');
                }

                button.innerHTML = `<span>${i}</span>`;

                if (dayEvents.length > 0) {
                    const dotContainer = document.createElement('div');
                    dotContainer.className = "flex space-x-0.5 mt-0.5";
                    
                    const hasRoutine = dayEvents.some(e => e.category === 'routine');
                    const hasHomework = dayEvents.some(e => e.category === 'homework');
                    const hasEvent = dayEvents.some(e => e.category === 'event');

                    if (hasRoutine) dotContainer.innerHTML += `<span class="w-1 h-1 rounded-full ${dateKey === selectedStr ? 'bg-white' : 'bg-indigo-400'}"></span>`;
                    if (hasHomework) dotContainer.innerHTML += `<span class="w-1 h-1 rounded-full ${dateKey === selectedStr ? 'bg-amber-200' : 'bg-amber-500'}"></span>`;
                    if (hasEvent) dotContainer.innerHTML += `<span class="w-1 h-1 rounded-full ${dateKey === selectedStr ? 'bg-emerald-200' : 'bg-emerald-500'}"></span>`;

                    button.appendChild(dotContainer);
                }

                button.onclick = () => {
                    selectedDate = new Date(year, month, i);
                    renderCalendar();
                    renderSelectedDate();
                };

                calendarGrid.appendChild(button);
            }
        }

        function renderSelectedDate() {
            const key = formatDateKey(selectedDate);
            const dayEvents = events[key] || [];

            selectedDateStr.textContent = formatDisplayDate(selectedDate);
            
            const isToday = formatDateKey(new Date()) === key;
            selectedDateHeading.textContent = isToday ? "本日の予定・タスク" : `${selectedDate.getMonth() + 1}月${selectedDate.getDate()}日の予定`;

            const homeworkCount = dayEvents.filter(e => e.category === 'homework').length;
            eventCountEl.textContent = dayEvents.length;
            homeworkCountEl.textContent = homeworkCount;

            renderEventsList(dayEvents);
            renderHabitsTracker(dayEvents);
            renderTimeline(dayEvents);
        }

        function renderEventsList(dayEvents) {
            eventsContainer.innerHTML = '';

            const filteredEvents = dayEvents.filter(e => currentFilter === 'all' || e.category === currentFilter);

            if (filteredEvents.length === 0) {
                eventsContainer.innerHTML = `
                    <div class="bg-white rounded-2xl p-8 border border-dashed border-slate-200 text-center text-slate-400">
                        <i data-lucide="calendar-x" class="w-10 h-10 mx-auto mb-2 opacity-50"></i>
                        <p class="text-sm font-medium">登録されている予定はありません</p>
                        <p class="text-xs mt-1">「予定・宿題を追加」ボタンから追加できます</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            filteredEvents.sort((a, b) => a.startTime.localeCompare(b.startTime));

            filteredEvents.forEach(item => {
                const card = document.createElement('div');
                card.className = `bg-white p-4 rounded-2xl border transition-all duration-200 flex items-start justify-between gap-3 ${
                    item.completed ? 'border-slate-200 bg-slate-50/50 opacity-75' : 'border-slate-200 shadow-sm hover:shadow-md'
                }`;

                let catBadge = '';
                if (item.category === 'routine') catBadge = '<span class="bg-indigo-50 text-indigo-600 text-[10px] font-bold px-2 py-0.5 rounded-md">ルーティン</span>';
                if (item.category === 'homework') catBadge = '<span class="bg-amber-50 text-amber-600 text-[10px] font-bold px-2 py-0.5 rounded-md">宿題・学習</span>';
                if (item.category === 'event') catBadge = '<span class="bg-emerald-50 text-emerald-600 text-[10px] font-bold px-2 py-0.5 rounded-md">一般予定</span>';

                card.innerHTML = `
                    <div class="flex items-start space-x-3 flex-1 min-w-0">
                        <input type="checkbox" ${item.completed ? 'checked' : ''} 
                            onclick="toggleComplete('${item.id}')"
                            class="mt-1 w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300 cursor-pointer">
                        
                        <div class="space-y-1 flex-1 min-w-0">
                            <div class="flex items-center space-x-2">
                                ${catBadge}
                                <span class="text-xs font-semibold text-slate-500 flex items-center gap-1">
                                    <i data-lucide="clock" class="w-3 h-3"></i> ${item.startTime} ${item.endTime ? '〜 ' + item.endTime : ''}
                                </span>
                                ${item.alarm ? '<i data-lucide="bell-ring" class="w-3 h-3 text-amber-500" title="連続アラーム付き"></i>' : ''}
                            </div>
                            
                            <h4 class="font-bold text-slate-800 text-sm ${item.completed ? 'line-through text-slate-400' : ''}">${escapeHtml(item.title)}</h4>
                            
                            ${item.category === 'homework' && (item.pages || item.estimatedTime) ? `
                                <div class="flex items-center gap-3 text-xs text-amber-700 bg-amber-50/80 px-2.5 py-1 rounded-lg w-fit">
                                    ${item.pages ? `<span><i data-lucide="book" class="w-3 h-3 inline mr-1"></i>${escapeHtml(item.pages)}</span>` : ''}
                                    ${item.estimatedTime ? `<span><i data-lucide="timer" class="w-3 h-3 inline mr-1"></i>${item.estimatedTime}分</span>` : ''}
                                </div>
                            ` : ''}

                            ${item.memo ? `<p class="text-xs text-slate-500 bg-slate-50 p-2 rounded-lg border border-slate-100">${escapeHtml(item.memo)}</p>` : ''}
                        </div>
                    </div>

                    <div class="flex items-center space-x-1 shrink-0">
                        <button onclick="editItem('${item.id}')" class="p-1.5 text-slate-400 hover:text-indigo-600 rounded-lg hover:bg-slate-100 transition-colors">
                            <i data-lucide="pencil" class="w-4 h-4"></i>
                        </button>
                        <button onclick="deleteItem('${item.id}')" class="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-slate-100 transition-colors">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;

                eventsContainer.appendChild(card);
            });

            lucide.createIcons();
        }

        function renderHabitsTracker(dayEvents) {
            habitsListContainer.innerHTML = '';
            const routines = dayEvents.filter(e => e.category === 'routine');

            if (routines.length === 0) {
                habitsListContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">ルーティンが登録されていません</p>`;
                habitCompletionRateEl.textContent = '0%';
                return;
            }

            const completedCount = routines.filter(r => r.completed).length;
            const rate = Math.round((completedCount / routines.length) * 100);
            habitCompletionRateEl.textContent = `${rate}% 完了`;

            routines.forEach(item => {
                const div = document.createElement('div');
                div.className = "flex items-center justify-between p-2.5 bg-slate-50 rounded-xl hover:bg-slate-100 transition-colors cursor-pointer";
                div.onclick = (e) => {
                    if (e.target.tagName !== 'INPUT') toggleComplete(item.id);
                };

                div.innerHTML = `
                    <div class="flex items-center space-x-2.5">
                        <input type="checkbox" ${item.completed ? 'checked' : ''} 
                            onclick="toggleComplete('${item.id}')"
                            class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300">
                        <span class="text-xs font-semibold ${item.completed ? 'line-through text-slate-400' : 'text-slate-700'}">${escapeHtml(item.title)}</span>
                    </div>
                    <span class="text-[10px] font-bold text-slate-400">${item.startTime}</span>
                `;
                habitsListContainer.appendChild(div);
            });
        }

        function renderTimeline(dayEvents) {
            const container = document.getElementById('timeline-container');
            container.innerHTML = '';

            for (let hour = 0; hour < 24; hour++) {
                const hourStr = String(hour).padStart(2, '0');
                const hourRow = document.createElement('div');
                hourRow.className = "flex items-start h-12 border-b border-slate-100 relative";
                
                hourRow.innerHTML = `
                    <div class="w-12 text-[11px] font-bold text-slate-400 shrink-0 select-none">${hourStr}:00</div>
                    <div class="flex-1 h-full relative border-l border-slate-200"></div>
                `;

                dayEvents.forEach(item => {
                    const startH = parseInt(item.startTime.split(':')[0]);
                    const startM = parseInt(item.startTime.split(':')[1]);

                    if (startH === hour) {
                        const topOffset = (startM / 60) * 48;
                        const eventEl = document.createElement('div');
                        
                        let bgColor = 'bg-indigo-100 border-indigo-300 text-indigo-800';
                        if (item.category === 'homework') bgColor = 'bg-amber-100 border-amber-300 text-amber-800';
                        if (item.category === 'event') bgColor = 'bg-emerald-100 border-emerald-300 text-emerald-800';

                        eventEl.className = `absolute left-14 right-2 p-1.5 rounded-lg border text-xs font-semibold shadow-sm z-10 ${bgColor}`;
                        eventEl.style.top = `${topOffset}px`;
                        
                        eventEl.innerHTML = `
                            <div class="flex justify-between items-center">
                                <span>${item.startTime} - ${escapeHtml(item.title)}</span>
                                ${item.pages ? `<span class="text-[10px] opacity-80">${escapeHtml(item.pages)}</span>` : ''}
                            </div>
                        `;
                        container.appendChild(eventEl);
                    }
                });

                container.appendChild(hourRow);
            }
        }

        function toggleComplete(id) {
            const key = formatDateKey(selectedDate);
            if (!events[key]) return;

            const item = events[key].find(e => e.id === id);
            if (item) {
                item.completed = !item.completed;
                saveToLocalStorage();
                renderSelectedDate();
                renderCalendar();
            }
        }

        function deleteItem(id) {
            const key = formatDateKey(selectedDate);
            if (!events[key]) return;

            events[key] = events[key].filter(e => e.id !== id);
            saveToLocalStorage();
            renderSelectedDate();
            renderCalendar();
        }

        function editItem(id) {
            const key = formatDateKey(selectedDate);
            if (!events[key]) return;

            const item = events[key].find(e => e.id === id);
            if (!item) return;

            document.getElementById('item-id').value = item.id;
            document.getElementById('item-title').value = item.title;
            document.getElementById('item-start-time').value = item.startTime;
            document.getElementById('item-end-time').value = item.endTime || '';
            document.getElementById('item-pages').value = item.pages || '';
            document.getElementById('item-estimated-time').value = item.estimatedTime || '';
            document.getElementById('item-alarm').checked = item.alarm || false;
            document.getElementById('item-memo').value = item.memo || '';

            const categoryRadios = document.getElementsByName('category');
            categoryRadios.forEach(radio => {
                if (radio.value === item.category) radio.checked = true;
            });

            toggleHomeworkFields(item.category);
            document.getElementById('modal-title').innerHTML = `<i data-lucide="pencil" class="w-5 h-5 text-indigo-600"></i> 予定の編集`;
            itemModal.classList.remove('hidden');
            lucide.createIcons();
        }

        function toggleHomeworkFields(category) {
            if (category === 'homework') {
                homeworkFields.classList.remove('hidden');
            } else {
                homeworkFields.classList.add('hidden');
            }
        }

        function setupEventListeners() {
            document.getElementById('prev-month-btn').onclick = () => {
                currentDate.setMonth(currentDate.getMonth() - 1);
                renderCalendar();
            };
            document.getElementById('next-month-btn').onclick = () => {
                currentDate.setMonth(currentDate.getMonth() + 1);
                renderCalendar();
            };
            document.getElementById('today-btn').onclick = () => {
                currentDate = new Date();
                selectedDate = new Date();
                renderCalendar();
                renderSelectedDate();
            };

            const tabListBtn = document.getElementById('tab-list-btn');
            const tabTimelineBtn = document.getElementById('tab-timeline-btn');
            const viewList = document.getElementById('view-list');
            const viewTimeline = document.getElementById('view-timeline');

            tabListBtn.onclick = () => {
                tabListBtn.className = "pb-3 text-sm font-bold text-indigo-600 border-b-2 border-indigo-600 flex items-center space-x-2";
                tabTimelineBtn.className = "pb-3 text-sm font-bold text-slate-400 border-b-2 border-transparent hover:text-slate-600 flex items-center space-x-2";
                viewList.classList.remove('hidden');
                viewTimeline.classList.add('hidden');
            };

            tabTimelineBtn.onclick = () => {
                tabTimelineBtn.className = "pb-3 text-sm font-bold text-indigo-600 border-b-2 border-indigo-600 flex items-center space-x-2";
                tabListBtn.className = "pb-3 text-sm font-bold text-slate-400 border-b-2 border-transparent hover:text-slate-600 flex items-center space-x-2";
                viewTimeline.classList.remove('hidden');
                viewList.classList.add('hidden');
            };

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.filter-btn').forEach(b => {
                        b.className = "filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50";
                    });
                    btn.className = "filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-white shadow-sm";
                    currentFilter = btn.dataset.filter;
                    renderSelectedDate();
                };
            });

            document.getElementById('open-add-modal-btn').onclick = () => {
                itemForm.reset();
                document.getElementById('item-id').value = '';
                document.getElementById('modal-title').innerHTML = `<i data-lucide="calendar-plus" class="w-5 h-5 text-indigo-600"></i> 予定・タスクの追加`;
                toggleHomeworkFields('routine');
                itemModal.classList.remove('hidden');
            };

            document.getElementById('close-modal-btn').onclick = () => itemModal.classList.add('hidden');
            document.getElementById('cancel-modal-btn').onclick = () => itemModal.classList.add('hidden');

            document.getElementsByName('category').forEach(radio => {
                radio.onchange = (e) => toggleHomeworkFields(e.target.value);
            });

            itemForm.onsubmit = (e) => {
                e.preventDefault();

                const id = document.getElementById('item-id').value || Date.now().toString();
                const category = document.querySelector('input[name="category"]:checked').value;
                const title = document.getElementById('item-title').value;
                const startTime = document.getElementById('item-start-time').value;
                const endTime = document.getElementById('item-end-time').value;
                const pages = document.getElementById('item-pages').value;
                const estimatedTime = document.getElementById('item-estimated-time').value;
                const alarm = document.getElementById('item-alarm').checked;
                const memo = document.getElementById('item-memo').value;

                const key = formatDateKey(selectedDate);
                if (!events[key]) events[key] = [];

                const existingIndex = events[key].findIndex(e => e.id === id);
                const newItem = {
                    id,
                    category,
                    title,
                    startTime,
                    endTime,
                    pages,
                    estimatedTime,
                    alarm,
                    memo,
                    completed: existingIndex >= 0 ? events[key][existingIndex].completed : false
                };

                if (existingIndex >= 0) {
                    events[key][existingIndex] = newItem;
                } else {
                    events[key].push(newItem);
                }

                saveToLocalStorage();
                itemModal.classList.add('hidden');
                renderCalendar();
                renderSelectedDate();
            };

            // Stop Continuous Alarm
            document.getElementById('dismiss-alarm-btn').onclick = () => {
                stopAlarmSound();
                document.getElementById('alarm-trigger-modal').classList.add('hidden');
            };

            // Test sound button
            document.getElementById('toggle-sound-btn').onclick = () => {
                playSingleBeep();
            };
        }

        function startClockAndAlarmChecker() {
            setInterval(() => {
                const now = new Date();
                const timeStr = now.toTimeString().split(' ')[0];
                document.getElementById('current-time-display').textContent = timeStr;

                const todayKey = formatDateKey(now);
                const currentHM = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

                if (events[todayKey]) {
                    events[todayKey].forEach(item => {
                        if (item.alarm && item.startTime === currentHM && !item.completed) {
                            const alarmKey = `${todayKey}-${item.id}-${currentHM}`;
                            if (!triggeredAlarms.has(alarmKey)) {
                                triggeredAlarms.add(alarmKey);
                                triggerContinuousAlarm(item);
                            }
                        }
                    });
                }
            }, 1000);
        }

        // Trigger loop alarm
        function triggerContinuousAlarm(item) {
            startAlarmSoundLoop();

            document.getElementById('alarm-modal-title').textContent = item.title;
            document.getElementById('alarm-modal-time').textContent = `開始時刻: ${item.startTime}`;
            document.getElementById('alarm-modal-memo').textContent = item.memo || (item.pages ? `宿題範囲: ${item.pages}` : '予定の時間になりました。確認してください！');

            document.getElementById('alarm-trigger-modal').classList.remove('hidden');
            lucide.createIcons();
        }

        // Starts an infinite loop of beep tones every 0.8 seconds until stopped
        function startAlarmSoundLoop() {
            stopAlarmSound(); // Clear any existing instance
            
            playSingleBeep(); // Play immediately
            alarmIntervalId = setInterval(() => {
                playSingleBeep();
            }, 800);
        }

        // Stops the looping alarm sound
        function stopAlarmSound() {
            if (alarmIntervalId) {
                clearInterval(alarmIntervalId);
                alarmIntervalId = null;
            }
        }

        // Synthesize single electronic beep pulse (Web Audio API)
        function playSingleBeep() {
            try {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) audioCtx = new AudioContext();
                }
                
                if (!audioCtx) return;
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;
                
                // Tone 1
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(880, now); // A5
                gain1.gain.setValueAtTime(0.3, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.15);

                // Tone 2 (Higher Beep)
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(1760, now + 0.2); // A6
                gain2.gain.setValueAtTime(0.3, now + 0.2);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now + 0.2);
                osc2.stop(now + 0.4);

            } catch(e) {
                console.log('Audio playback context error', e);
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }
    </script>
</body>
</html>
